<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }}｜{% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.meaning %}{{ page.meaning | strip_html | escape }}{% else %}{{ site.description | escape }}{% endif %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
</head>
<body data-baseurl="{{ site.baseurl }}">
  {% include header.html %}
  <main class="site-main">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/search.js' | relative_url }}" defer></script>
  {% if page.scripts %}{% for s in page.scripts %}
  <script src="{{ s | relative_url }}" defer></script>
  {% endfor %}{% endif %}
</body>
</html>
