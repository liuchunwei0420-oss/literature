<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-seal" aria-hidden="true">典</span>
      <span class="brand-text">
        <strong>{{ site.title }}</strong>
        <small>{{ site.tagline }}</small>
      </span>
    </a>
    <nav class="site-nav" aria-label="主選單">
      {% for sec in site.data.sections %}
      <a href="{{ sec.url | relative_url }}" class="{% if page.url contains sec.url %}is-active{% endif %}">
        {{ sec.label }}{% if sec.status == 'soon' %}<em class="soon">籌備中</em>{% endif %}
      </a>
      {% endfor %}
    </nav>
    {% include search-box.html %}
  </div>
</header>
