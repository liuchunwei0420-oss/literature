# ============================================================
# 網站基本設定
# ============================================================
title: 古典小書房
tagline: 一則成語，一段故事
description: 用白話故事和可愛插圖，認識成語背後的典故。之後還會加入古典詩詞。
lang: zh-Hant-TW

# 部署到 GitHub Pages 時要改這兩行：
# - 如果 repo 名稱是「你的帳號.github.io」：baseurl 留空 ""
# - 如果是一般 repo（例如 classics）：baseurl 填 "/classics"
url: "https://your-account.github.io"
baseurl: ""

# ============================================================
# 內容集合（collections）
# 每一種內容放在自己的資料夾，網址也分開。
# 之後要加詩詞，把下面 poems 那段的 # 拿掉即可。
# ============================================================
collections:
  idioms:            # 成語 → _idioms/ 資料夾
    output: true
    permalink: /chengyu/:name/
  # poems:           # 詩詞 → _poems/ 資料夾（預留）
  #   output: true
  #   permalink: /shici/:name/

defaults:
  - scope:
      path: ""
      type: idioms
    values:
      layout: idiom
  # - scope:
  #     path: ""
  #     type: poems
  #   values:
  #     layout: poem

# ============================================================
# 建置設定
# ============================================================
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - _templates
  - tools
  - package.json
  - node_modules
  - vendor
  - .github
