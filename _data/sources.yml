# 典籍資料庫
# 成語和之後的詩詞都可以共用這份書目。
# 在內容檔的 source.book 填左邊的代號，頁面就會自動帶出書名、作者、年代。
#
# type: author 的條目代表「單篇作品」，頁面會顯示成「作者〈篇名〉」，
# 例如 孟郊〈登科後〉；其他條目顯示成《書名·篇章》。

# ---------- 經部 ----------
zhouyi:
  name: 周易
  author: 不詳
  era: 周代
lunyu:
  name: 論語
  author: 孔子弟子及再傳弟子
  era: 春秋末至戰國初
mengzi:
  name: 孟子
  author: 孟子及其弟子
  era: 戰國
  note: 儒家經典，記錄孟子的言行與論辯。
shijing:
  name: 詩經
  author: 不詳
  era: 西周至春秋
liji:
  name: 禮記
  author: 西漢 戴聖 編
  era: 戰國至秦漢
zuozhuan:
  name: 左傳
  author: 相傳為左丘明
  era: 春秋

# ---------- 子部 ----------
laozi:
  name: 老子
  author: 老子
  era: 春秋末
zhuangzi:
  name: 莊子
  author: 莊周及其後學
  era: 戰國
  note: 道家經典，善用寓言講道理。
liezi:
  name: 列子
  author: 舊題列禦寇
  era: 成書年代有爭議，一般認為經魏晉人整理
xunzi:
  name: 荀子
  author: 荀況
  era: 戰國
hanfeizi:
  name: 韓非子
  author: 韓非
  era: 戰國
  note: 法家代表著作，書中收了許多短小的寓言。
sunzi:
  name: 孫子兵法
  author: 孫武
  era: 春秋
lvshi:
  name: 呂氏春秋
  author: 呂不韋門客
  era: 戰國末
huainanzi:
  name: 淮南子
  author: 劉安及門客
  era: 西漢
yanzi:
  name: 晏子春秋
  author: 後人託名晏嬰
  era: 戰國
xinxu:
  name: 新序
  author: 劉向
  era: 西漢
lienv:
  name: 列女傳
  author: 劉向
  era: 西漢
fengsu:
  name: 風俗通義
  author: 應劭
  era: 東漢
mouzi:
  name: 牟子理惑論
  author: 牟融
  era: 東漢末
  note: 收在南朝梁僧祐編的《弘明集》裡。
shanhaijing:
  name: 山海經
  author: 不詳
  era: 先秦至漢
fahua:
  name: 妙法蓮華經
  author: 後秦 鳩摩羅什 譯
  era: 後秦

# ---------- 史部 ----------
zhanguoce:
